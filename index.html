<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Apple Repair</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #9b2dff; /* Фиолетовый цвет с твоих референсов */
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif; 
            margin: 0; 
            padding: 0;
            background: linear-gradient(160deg, #3a0099 0%, #a435f0 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Приветственный экран */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(160deg, #1f004d 0%, #7d12ff 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* Воссозданный логотип по фото image_11.png */
        .logo-container {
            width: 140px;
            height: 140px;
            margin-bottom: 20px;
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.5));
        }

        .welcome-title { font-size: 34px; font-weight: 800; letter-spacing: 1px; margin: 0; }
        .welcome-subtitle { color: #e1ccff; margin-top: 8px; font-size: 16px; }
        
        .start-btn {
            margin-top: 40px;
            background: #ffffff;
            color: var(--primary);
            border: none;
            padding: 16px 45px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 800;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Основная форма */
        #main-app {
            display: none;
            padding: 20px;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .header-small { text-align: center; margin-bottom: 25px; margin-top: 10px; }
        .header-small h2 { margin: 0; font-size: 24px; font-weight: 800; }

        .card { 
            background: rgba(30, 30, 30, 0.6); 
            backdrop-filter: blur(10px);
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .field { margin-bottom: 18px; }
        .field:last-child { margin-bottom: 0; }
        
        label { 
            display: block; 
            font-size: 12px; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: #e1ccff; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        select, input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(0,0,0,0.4); 
            color: var(--text-light); 
            font-size: 16px; 
            box-sizing: border-box; 
            outline: none;
            transition: all 0.3s;
        }

        select:focus, input:focus { border-color: var(--primary); background: rgba(0,0,0,0.6); }
        option { background: var(--card-bg); color: white; }

        .hidden-field { display: none; margin-top: 12px; }
    </style>
</head>
<body>

    <!-- ПРИВЕТСТВЕННЫЙ ЭКРАН -->
    <div id="welcome-screen">
        <div class="logo-container">
            <!-- Точная копия твоего логотипа -->
            <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                <circle cx="256" cy="256" r="256" fill="#000000"/>
                <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" fill="#ffffff" transform="translate(0, -30)"/>
                <circle cx="400" cy="360" r="70" fill="#9b2dff" stroke="#ffffff" stroke-width="8"/>
            </svg>
        </div>
        <h1 class="welcome-title">Apple Repair</h1>
        <p class="welcome-subtitle">Профессиональный сервис</p>
        <button class="start-btn" onclick="startApp()">Перейти к заявке</button>
    </div>

    <!-- ОСНОВНАЯ ФОРМА -->
    <div id="main-app">
        <div class="header-small">
            <h2>Оформление заявки</h2>
        </div>

        <div class="card">
            <div class="field">
                <label>Марка устройства</label>
                <select id="brand" onchange="updateModels()">
                    <option value="" disabled selected>Выберите марку</option>
                    <option value="Apple">Apple</option>
                    <option value="Samsung">Samsung</option>
                    <option value="Xiaomi">Xiaomi</option>
                    <option value="Honor">Honor</option>
                    <option value="Huawei">Huawei</option>
                    <option value="Tecno">Tecno</option>
                    <option value="Oppo">Oppo</option>
                    <option value="Vivo">Vivo</option>
                    <option value="Google Pixel">Google Pixel</option>
                    <option value="Другая">Нет вашей марки? Укажите марку</option>
                </select>
                <input type="text" id="customBrand" class="hidden-field" placeholder="Введите название марки">
            </div>
            
            <div class="field">
                <label>Модель устройства</label>
                <select id="modelSelect" onchange="checkCustomModel()">
                    <option value="" disabled selected>Сначала выберите марку</option>
                </select>
                <input type="text" id="customModel" class="hidden-field" placeholder="Введите название модели">
            </div>

            <div class="field">
                <label>Тип поломки</label>
                <select id="damageType">
                    <option>Замена дисплея / стекла</option>
                    <option>Замена аккумулятора</option>
                    <option>Не заряжается / Замена разъема</option>
                    <option>Попадание жидкости (утопленник)</option>
                    <option>Сложный ремонт платы / Не включается</option>
                    <option>Проблемы с камерой</option>
                    <option>Замена задней крышки</option>
                    <option>Другая проблема</option>
                </select>
            </div>
        </div>

        <div class="card">
            <div class="field">
                <label>Срочность выполнения</label>
                <input type="text" id="deadline" placeholder="Например: нужно за 1-2 часа">
            </div>
            <div class="field">
                <label>Примерный бюджет (₽)</label>
                <input type="number" id="budget" placeholder="Сумма, на которую рассчитываете">
            </div>
            <div class="field">
                <label>Контакт для связи</label>
                <input type="text" id="contact" placeholder="Номер телефона или ник Telegram">
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Супер-база всех устройств с 2017 по 2026 год
        const phoneModels = {
            "Apple": ["iPhone 18 Pro Max", "iPhone 18 Pro", "iPhone 18 Plus", "iPhone 18", "iPhone 17 Pro Max", "iPhone 17 Pro", "iPhone 17 Plus", "iPhone 17", "iPhone 16 Pro Max", "iPhone 16 Pro", "iPhone 16 Plus", "iPhone 16", "iPhone 15 Pro Max", "iPhone 15 Pro", "iPhone 15 Plus", "iPhone 15", "iPhone 14 Pro Max", "iPhone 14 Pro", "iPhone 14 Plus", "iPhone 14", "iPhone 13 Pro Max", "iPhone 13 Pro", "iPhone 13 mini", "iPhone 13", "iPhone 12 Pro Max", "iPhone 12 Pro", "iPhone 12 mini", "iPhone 12", "iPhone 11 Pro Max", "iPhone 11 Pro", "iPhone 11", "iPhone XS Max", "iPhone XS", "iPhone XR", "iPhone X", "iPhone 8 Plus", "iPhone 8", "iPhone SE (3-го поколения, 2022)", "iPhone SE (2-го поколения, 2020)"],
            "Samsung": ["Galaxy S26 Ultra", "Galaxy S26+", "Galaxy S26", "Galaxy S25 Ultra", "Galaxy S25+", "Galaxy S25", "Galaxy S24 Ultra", "Galaxy S24+", "Galaxy S24", "Galaxy S23 Ultra", "Galaxy S23+", "Galaxy S23", "Galaxy S22 Ultra", "Galaxy S22+", "Galaxy S22", "Galaxy S21 Ultra", "Galaxy S21+", "Galaxy S21", "Galaxy S20 Ultra", "Galaxy S20+", "Galaxy S20", "Galaxy S10+", "Galaxy S10", "Galaxy S9+", "Galaxy S9", "Galaxy S8+", "Galaxy S8", "Galaxy Note 20 Ultra", "Galaxy Note 20", "Galaxy Note 10+", "Galaxy Note 10", "Galaxy Note 9", "Galaxy Note 8", "Galaxy Z Fold 8", "Galaxy Z Fold 7", "Galaxy Z Fold 6", "Galaxy Z Fold 5", "Galaxy Z Fold 4", "Galaxy Z Fold 3", "Galaxy Z Fold 2", "Galaxy Fold", "Galaxy Z Flip 8", "Galaxy Z Flip 7", "Galaxy Z Flip 6", "Galaxy Z Flip 5", "Galaxy Z Flip 4", "Galaxy Z Flip 3", "Galaxy Z Flip", "Galaxy A57", "Galaxy A56", "Galaxy A55", "Galaxy A54", "Galaxy A53", "Galaxy A52", "Galaxy A51", "Galaxy A50", "Galaxy A36", "Galaxy A35", "Galaxy A34", "Galaxy A33", "Galaxy A32", "Galaxy A31", "Galaxy A16", "Galaxy A15", "Galaxy A14", "Galaxy A13", "Galaxy A07", "Galaxy A06", "Galaxy A05", "Galaxy M55", "Galaxy M54", "Galaxy M34"],
            "Xiaomi": ["Xiaomi 16 Ultra", "Xiaomi 16 Pro", "Xiaomi 16", "Xiaomi 15 Ultra", "Xiaomi 15 Pro", "Xiaomi 15", "Xiaomi 14 Ultra", "Xiaomi 14 Pro", "Xiaomi 14", "Xiaomi 13 Ultra", "Xiaomi 13 Pro", "Xiaomi 13", "Xiaomi 12S Ultra", "Xiaomi 12 Pro", "Xiaomi 12", "Mi 11 Ultra", "Mi 11", "Mi 10", "Mi 9", "Mi 8", "Mi 6", "Redmi Note 15 Pro+", "Redmi Note 15", "Redmi Note 14 Pro+", "Redmi Note 14", "Redmi Note 13 Pro+", "Redmi Note 13 Pro", "Redmi Note 13", "Redmi Note 12 Pro", "Redmi Note 12", "Redmi Note 11", "Redmi Note 10", "Redmi Note 9", "Redmi Note 8", "Redmi Note 7", "Redmi Note 5", "Poco F8", "Poco F7", "Poco F6 Pro", "Poco F6", "Poco F5 Pro", "Poco F5", "Poco X6 Pro", "Poco X6", "Poco X5 Pro", "Poco X3 Pro", "Poco F1"],
            "Honor": ["Magic 8 Pro", "Magic 7 Pro", "Magic 6 Pro", "Magic 5 Pro", "Magic 4 Pro", "Honor 200 Pro", "Honor 200", "Honor 100 Pro", "Honor 100", "Honor 90", "Honor 70", "Honor 50", "Honor 30 Pro+", "Honor 30", "Honor 20 Pro", "Honor 20", "Honor 10", "Honor 9", "Honor X9c", "Honor X9b", "Honor X8b", "Honor X7b"],
            "Huawei": ["Mate 80 Pro", "Mate 70 Pro", "Mate 60 Pro", "Mate 50 Pro", "Mate 40 Pro", "Mate 30 Pro", "Mate 20 Pro", "Mate 10 Pro", "Pura 80 Ultra", "Pura 70 Ultra", "Pura 70 Pro", "P60 Pro", "P50 Pro", "P40 Pro", "P30 Pro", "P30", "P20 Pro", "P20", "P10", "Nova 13 Pro", "Nova 12 Pro", "Nova 11 Pro", "Nova 10", "Nova 9", "Nova 5T"],
            "Tecno": ["Phantom V Fold 2", "Phantom V Flip 2", "Phantom X3 Pro", "Phantom X2 Pro", "Camon 40 Pro", "Camon 30 Premier", "Camon 30 Pro", "Camon 30", "Camon 20 Premier", "Camon 20 Pro", "Camon 19 Pro", "Camon 18", "Camon 15", "Spark 30 Pro", "Spark 20 Pro", "Spark 10 Pro", "Pova 7 Pro", "Pova 6 Pro", "Pova 5 Pro"],
            "Oppo": ["Find X8 Ultra", "Find X7 Ultra", "Find X6 Pro", "Find X5 Pro", "Find X3 Pro", "Find X2 Pro", "Find X", "Reno 13 Pro", "Reno 12 Pro", "Reno 11 Pro", "Reno 10 Pro", "Reno 8 Pro", "Reno 6", "Reno 4", "A98", "A79", "A78", "A58"],
            "Vivo": ["X200 Pro", "X100 Pro", "X100", "X90 Pro+", "X80 Pro", "X70 Pro+", "X60 Pro", "X50 Pro", "X21", "V40 Pro", "V30 Pro", "V29", "V27", "V25", "V23", "Y200", "Y100", "Y36", "Y22"],
            "Google Pixel": ["Pixel 11 Pro", "Pixel 11", "Pixel 10 Pro XL", "Pixel 10", "Pixel 9 Pro XL", "Pixel 9 Pro", "Pixel 9", "Pixel 8 Pro", "Pixel 8", "Pixel 7a", "Pixel 7 Pro", "Pixel 7", "Pixel 6a", "Pixel 6 Pro", "Pixel 6", "Pixel 5a", "Pixel 5", "Pixel 4a", "Pixel 4 XL", "Pixel 4", "Pixel 3 XL", "Pixel 3", "Pixel 2 XL", "Pixel 2"]
        };

        function startApp() {
            document.getElementById('welcome-screen').style.transform = 'scale(1.1)';
            document.getElementById('welcome-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                tg.MainButton.setText("ОТПРАВИТЬ ЗАЯВКУ");
                tg.MainButton.show();
            }, 400);
        }

        function updateModels() {
            const brandSelect = document.getElementById('brand').value;
            const modelSelect = document.getElementById('modelSelect');
            const customBrand = document.getElementById('customBrand');
            const customModel = document.getElementById('customModel');
            
            if (brandSelect === "Другая") {
                // Если нет марки в списке
                customBrand.style.display = 'block';
                modelSelect.style.display = 'none';
                customModel.style.display = 'block';
                customModel.placeholder = "Введите название модели";
            } else {
                // Если марка выбрана из списка
                customBrand.style.display = 'none';
                modelSelect.style.display = 'block';
                customModel.style.display = 'none';
                
                modelSelect.innerHTML = '<option value="" disabled selected>Выберите модель</option>';
                
                if (phoneModels[brandSelect]) {
                    phoneModels[brandSelect].forEach(model => {
                        modelSelect.innerHTML += `<option value="${model}">${model}</option>`;
                    });
                    modelSelect.innerHTML += `<option value="Другая">Нет Вашего телефона? Укажите модель</option>`;
                }
            }
        }

        function checkCustomModel() {
            const val = document.getElementById('modelSelect').value;
            if (val === "Другая") {
                document.getElementById('customModel').style.display = 'block';
                document.getElementById('customModel').placeholder = "Укажите вашу модель";
            } else {
                document.getElementById('customModel').style.display = 'none';
            }
        }

        tg.MainButton.onClick(function() {
            let finalBrand = document.getElementById('brand').value;
            let finalModel = document.getElementById('modelSelect').style.display === 'none' ? '' : document.getElementById('modelSelect').value;

            // Обработка ручного ввода
            if (finalBrand === "Другая") {
                finalBrand = document.getElementById('customBrand').value.trim();
                finalModel = document.getElementById('customModel').value.trim();
            } else if (finalModel === "Другая") {
                finalModel = document.getElementById('customModel').value.trim();
            }

            const contact = document.getElementById('contact').value.trim();
            
            if (!finalBrand || !finalModel || !contact) {
                tg.showAlert("Пожалуйста, заполните марку, модель и контакт для связи!");
                return;
            }

            // ТВОИ ДАННЫЕ ВШИТЫ СЮДА:
            const BOT_TOKEN = "8581552391:AAHmLrG1yWOwUaDK1HdcWkISSbFtXSTkshc"; 
            const CHAT_ID = "5146462288"; 

            const user = tg.initDataUnsafe?.user;
            const username = user?.username ? `@${user.username}` : "Не указан";

            const text = `⚙️ <b>НОВАЯ ЗАЯВКА - APPLE REPAIR</b>\n\n` +
                         `📱 <b>Устройство:</b> ${finalBrand} ${finalModel}\n` +
                         `🔧 <b>Поломка:</b> ${document.getElementById('damageType').value}\n` +
                         `⏱ <b>Срочность:</b> ${document.getElementById('deadline').value || "Не указана"}\n` +
                         `💰 <b>Бюджет:</b> ${document.getElementById('budget').value || "Не указан"}\n\n` +
                         `📞 <b>Связь:</b> ${contact}\n` +
                         `👤 <b>Telegram:</b> ${username}`;

            tg.MainButton.showProgress();

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: "HTML" })
            })
            .then(response => {
                tg.MainButton.hideProgress();
                tg.showAlert("Заявка отправлена! Мастер скоро свяжется с вами.", () => tg.close());
            })
            .catch(error => {
                tg.MainButton.hideProgress();
                tg.showAlert("Произошла ошибка при отправке. Пожалуйста, попробуйте еще раз.");
            });
        });
    </script>
</body>
</html>
