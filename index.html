<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Service | Заявка на ремонт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent: #007aff;
            --accent-gradient: linear-gradient(135deg, #007aff, #5856d6);
            --text-main: #ffffff;
            --text-secondary: #8e8e93;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 122, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(88, 86, 214, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .option-card:active, .option-card.selected {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            transform: scale(0.98);
        }

        .full-width {
            grid-column: span 2;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            color: var(--text-main);
            font-size: 15px;
            resize: none;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .btn-primary {
            width: 100%;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
            transition: opacity 0.2s;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .steps-indicator {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.3s;
        }

        .dot.active {
            background: var(--accent);
            width: 18px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="steps-indicator" id="indicator">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- Шаг 1: Марка -->
        <div class="step active" id="step-1">
            <h2>Выберите устройство</h2>
            <div class="grid-options">
                <div class="option-card full-width" onclick="selectBrand('iPhone')">📱 iPhone</div>
                <div class="option-card" onclick="selectBrand('iPad')">タブ iPad</div>
                <div class="option-card" onclick="selectBrand('Apple Watch')">⌚️ Watch</div>
            </div>
        </div>

        <!-- Шаг 2: Модель -->
        <div class="step" id="step-2">
            <h2>Укажите модель</h2>
            <div class="grid-options" id="models-container">
                <!-- Динамически заполняется -->
            </div>
            <a class="Назад" onclick="prevStep(1)">← Назад</a>
        </div>

        <!-- Шаг 3: Тип поломки -->
        <div class="step" id="step-3">
            <h2>Что случилось?</h2>
            <div class="grid-options">
                <div class="option-card" onclick="selectDamage('Разбит экран / Дисплей')">💥 Разбился экран</div>
                <div class="option-card" onclick="selectDamage('Быстро садится / Аккумулятор')">🔋 Плохой аккумулятор</div>
                <div class="option-card" onclick="selectDamage('Не заряжается / Разъем')">🔌 Не заряжается</div>
                <div class="option-card" onclick="selectDamage('Попала влага / Вода')">💧 Попала влага</div>
                <div class="option-card full-width" onclick="selectDamage('Другая проблема')">⚙️ Другая проблема</div>
            </div>
            <a class="back-link" onclick="prevStep(2)">← Назад</a>
        </div>

        <!-- Шаг 4: Пояснение + ИИ анализ -->
        <div class="step" id="step-4">
            <h2>Опишите детали поломки</h2>
            <textarea id="descInput" placeholder="Например: экран моргает после падения, сенсор местами не реагирует..."></textarea>
            <button class="btn-primary" onclick="submitOrder()">🚀 Отправить заявку</button>
            <a class="back-link" onclick="prevStep(3)">← Назад</a>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let orderData = {
            brand: '',
            model: '',
            damage: '',
            desc: '',
            client_id: tg.initDataUnsafe?.user?.id || '5146462288',
            username: tg.initDataUnsafe?.user?.username || 'user'
        };

        const modelsData = {
            'iPhone': ['iPhone 15 / Pro', 'iPhone 14 / Pro', 'iPhone 13 / Pro', 'iPhone 12 / Pro', 'iPhone 11 / X / SE'],
            'iPad': ['iPad Air', 'iPad Pro', 'iPad Mini', 'iPad 10.2'],
            'Apple Watch': ['Watch Series 9 / 8', 'Watch Series 7 / 6', 'Watch SE']
        };

        function haptic() {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        function showStep(stepIndex) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById(`step-${stepIndex}`).classList.add('active');
            
            document.querySelectorAll('.dot').forEach((dot, idx) => {
                dot.classList.toggle('active', idx === stepIndex - 1);
            });
        }

        function prevStep(stepIndex) {
            haptic();
            showStep(stepIndex);
        }

        function selectBrand(brand) {
            haptic();
            orderData.brand = brand;
            
            const container = document.getElementById('models-container');
            container.innerHTML = '';
            
            modelsData[brand].forEach(m => {
                const div = document.createElement('div');
                div.className = 'option-card' + (modelsData[brand].length % 2 !== 0 && m === modelsData[brand][modelsData[brand].length - 1] ? ' full-width' : '');
                div.innerHTML = m;
                div.onclick = () => selectModel(m);
                container.appendChild(div);
            });

            showStep(2);
        }

        function selectModel(model) {
            haptic();
            orderData.model = model;
            showStep(3);
        }

        function selectDamage(damage) {
            haptic();
            orderData.damage = damage;
            showStep(4);
        }

        function submitOrder() {
            haptic();
            orderData.desc = document.getElementById('descInput').value;

            fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    client_id: orderData.client_id,
                    brand: orderData.brand,
                    model: orderData.model,
                    damageType: orderData.damage,
                    diagnosticDesc: orderData.desc,
                    username: orderData.username,
                    budget: 'По запросу',
                    deadline: '1 день',
                    contact: '@' + orderData.username
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    tg.showAlert("✅ Заявка успешно отправлена мастеру! Ожидайте уведомления в боте.");
                    tg.close();
                } else {
                    tg.showAlert("⚠️ Ошибка отправки. Попробуйте еще раз.");
                }
            })
            .catch(err => {
                tg.showAlert("⚠️ Ошибка соединения с сервером.");
            });
        }
    </script>
</body>
</html>
